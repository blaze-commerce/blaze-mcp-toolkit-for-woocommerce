name: CI

on:
  push:
    branches: [ main, 'feat/**', 'release/**' ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer phpcs
      - run: composer test
      - if: matrix.php == '8.1'
        run: git ls-files '*.php' | grep -v '^tests/' | xargs -n1 -P4 php -l

  build:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: ./scripts/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip

  integration:
    name: integration (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: php
    strategy:
      fail-fast: false
      matrix:
        env: [ min, current ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: npm install
      - run: if [ "${{ matrix.env }}" = "min" ]; then cp .wp-env.min.json .wp-env.override.json; fi
      - run: npx wp-env start
      - run: npx wp-env run cli wp plugin activate woocommerce mcp-adapter enable-abilities-for-mcp plugin-check blaze-mcp-toolkit-for-woocommerce
      # The canonical runner: every test file with BLZMCP_SKIP_HTTP=1 in the container, the
      # bundled/workflow files again in stand-aside mode, then the host-side front-end curl check
      # (the runner reaches wp-env's published localhost:8888). Exits nonzero if any stage fails.
      - name: Integration tests
        shell: bash
        run: bash scripts/run-integration.sh
      - name: Plugin Check (built zip)
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-zip.sh
          # Same environment as this matrix entry, with the built plugin instead of the dev tree.
          # Written as the whole config (not an override): wp-env merges override mappings into
          # the base ones, which would keep the dev-tree mapping.
          base=.wp-env.json
          if [ "${{ matrix.env }}" = "min" ]; then base=.wp-env.min.json; fi
          jq '.plugins |= map(if . == "." then "./dist/blaze-mcp-toolkit-for-woocommerce" else . end) | .mappings = {}' "$base" > "$RUNNER_TEMP/wp-env.json"
          mv "$RUNNER_TEMP/wp-env.json" .wp-env.json
          rm -f .wp-env.override.json
          cat .wp-env.json
          npx wp-env start --update
          npx wp-env run cli wp plugin check blaze-mcp-toolkit-for-woocommerce --format=json | tee plugin-check.txt
          if grep -q '"type":"ERROR"' plugin-check.txt; then
            echo "Plugin Check reported errors"
            exit 1
          fi
