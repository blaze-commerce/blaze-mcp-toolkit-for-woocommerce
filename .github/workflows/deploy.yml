name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: composer phpcs
      - run: composer test
      - run: composer install --no-dev --prefer-dist --no-interaction --classmap-authoritative
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qE "^Stable tag: ${TAG}$" readme.txt
          grep -qE "^ \* Version:[[:space:]]+${TAG}$" blaze-mcp-toolkit-for-woocommerce.php
      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: blaze-mcp-toolkit-for-woocommerce
          ASSETS_DIR: .wordpress-org
